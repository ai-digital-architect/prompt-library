name: Spring Framework CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]  # Triggers on pushes to main/dev
  pull_request:
    branches: [ "main" ]         # Triggers on PRs targeting main
  workflow_dispatch:             # Allows manual triggering from GitHub UI

env:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"  # Local Maven repo path
  DOCKER_IMAGE: "ghcr.io/${{ github.repository_owner }}/spring-app:latest"  # Docker image name

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest       # Ubuntu runner

    services:                    # Spin up PostgreSQL for integration tests
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports: [ "5432:5432" ]   # Expose PostgreSQL port
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4     # Check out your repository

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.m2/repository          # Maven local repo
            target                    # Build artifacts
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Build and Test with Maven
        run: mvn -B clean verify      # Runs unit + integration tests

      - name: Static Code Analysis (SpotBugs/PMD/Checkstyle)
        if: always()                  # Runs even if previous steps fail
        run: mvn -B checkstyle:check pmd:pmd spotbugs:spotbugs

      - name: Upload Test Reports
        uses: actions/upload-artifact@v3
        if: failure()                 # Upload reports only if tests fail
        with:
          name: test-reports
          path: |
            **/target/surefire-reports
            **/target/failsafe-reports
            **/target/checkstyle-result.xml

  docker-build:
    name: Build Docker Image
    needs: build-and-test            # Depends on build-and-test job
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'  # Only run on main branch

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}
          labels: "org.opencontainers.image.source=${{ github.repository }}"

  deploy:
    name: Deploy (Manual Trigger)
    needs: docker-build
    runs-on: ubuntu-latest
    environment: production         # Requires GitHub environment setup

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v3
        with:
          name: spring-app-artifact

      - name: Deploy to Cloud (Example)
        run: echo "Deploy logic here (e.g., kubectl, AWS CLI, etc.)"
        env:
          KUBECONFIG: ${{ secrets.KUBE_CONFIG_DATA }}  # Example secret